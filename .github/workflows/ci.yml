name: verify
on: { push: { branches: [master, main] }, pull_request: { branches: [master, main] } }
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run verify
      - run: node scripts/ingest.mjs Local_Math_Vault/Question_Bank
      - run: python math_builder.py --topic circle_theorems --grade 10 --out ./dist --help || echo "typst optional in CI"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: week-pdfs, path: dist/week*/sheet.pdf }
