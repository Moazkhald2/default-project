name: automate-nightly
on:
  schedule:
    - cron: "0 2 * * *" # daily 02:00 UTC = 04:00 Cairo
  workflow_dispatch:
permissions:
  contents: read
jobs:
  automate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/automate.mjs --check
      - run: npm run verify
